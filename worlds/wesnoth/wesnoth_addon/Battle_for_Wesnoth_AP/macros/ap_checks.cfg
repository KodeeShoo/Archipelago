#textdomain wesnoth-Battle_for_Wesnoth_AP

#define AP_LOAD_BRIDGE
    [lua]
        code = <<
            local bridge = wesnoth.dofile("~add-ons/Battle_for_Wesnoth_AP/lua/ap_bridge.lua")
            bridge.load()
        >>
    [/lua]
#enddef

#define AP_LOAD_BRIDGE_NOTIFY
    [lua]
        code = <<
            local bridge = wesnoth.dofile("~add-ons/Battle_for_Wesnoth_AP/lua/ap_bridge.lua")
            bridge.load(true)
        >>
    [/lua]
#enddef

#define AP_SAVE_BRIDGE
    [lua]
        code = <<
            local bridge = wesnoth.dofile("~add-ons/Battle_for_Wesnoth_AP/lua/ap_bridge.lua")
            bridge.save()
        >>
    [/lua]
#enddef

#define AP_MARK_LOCATION LOCATION_NAME
    [lua]
        code = <<
            local bridge = wesnoth.dofile("~add-ons/Battle_for_Wesnoth_AP/lua/ap_bridge.lua")
            local args = ...
            bridge.mark_location(args.name)
        >>
        [args]
            name={LOCATION_NAME}
        [/args]
    [/lua]
    [message]
        speaker=narrator
        message= _ "Archipelago check recorded."
    [/message]
#enddef

#define AP_HAS_ITEM ITEM_NAME VARIABLE_NAME
    [set_variable]
        name={VARIABLE_NAME}
        value=no
    [/set_variable]
    [foreach]
        array=ap_received_items
        variable=ap_item
        [do]
            [if]
                [variable]
                    name=ap_item.name
                    equals={ITEM_NAME}
                [/variable]
                [then]
                    [set_variable]
                        name={VARIABLE_NAME}
                        value=yes
                    [/set_variable]
                [/then]
            [/if]
        [/do]
    [/foreach]
#enddef

#define AP_ALLOW_RECRUIT_ITEM ITEM_NAME SIDE UNIT_TYPE
    {AP_HAS_ITEM {ITEM_NAME} ap_has_item}
    [if]
        [variable]
            name=ap_has_item
            equals=yes
        [/variable]
        [then]
            [allow_recruit]
                side={SIDE}
                type={UNIT_TYPE}
            [/allow_recruit]
        [/then]
    [/if]
#enddef

#define AP_SET_UNLOCKED_RECRUITS SIDE
    [set_recruit]
        side={SIDE}
        recruit=$ap_recruit_list
    [/set_recruit]
#enddef

#define AP_HAS_UNLOCKED_ATTACK ATTACK_KEY VARIABLE_NAME
    [set_variable]
        name={VARIABLE_NAME}
        value=no
    [/set_variable]
    [foreach]
        array=ap_unlocked_attacks
        variable=ap_attack_item
        [do]
            [if]
                [variable]
                    name=ap_attack_item.name
                    equals={ATTACK_KEY}
                [/variable]
                [then]
                    [set_variable]
                        name={VARIABLE_NAME}
                        value=yes
                    [/set_variable]
                [/then]
            [/if]
        [/do]
    [/foreach]
#enddef

#define AP_GRANT_GOLD_ONCE ITEM_NAME SIDE AMOUNT STATE_VARIABLE
    {AP_HAS_ITEM {ITEM_NAME} ap_has_item}
    [if]
        [variable]
            name=ap_has_item
            equals=yes
        [/variable]
        [and]
            [variable]
                name={STATE_VARIABLE}
                not_equals=yes
            [/variable]
        [/and]
        [then]
            [gold]
                side={SIDE}
                amount={AMOUNT}
            [/gold]
            {VARIABLE {STATE_VARIABLE} yes}
        [/then]
    [/if]
#enddef

#define AP_REMOVE_ATTACK_UNLESS_UNLOCKED ATTACK_KEY SIDE UNIT_TYPE ATTACK_NAME ATTACK_RANGE
    {AP_HAS_UNLOCKED_ATTACK {ATTACK_KEY} ap_has_attack}
    [if]
        [variable]
            name=ap_has_attack
            not_equals=yes
        [/variable]
        [then]
            [modify_unit]
                [filter]
                    side={SIDE}
                    type={UNIT_TYPE}
                [/filter]
                [effect]
                    apply_to=remove_attacks
                    name={ATTACK_NAME}
                    range={ATTACK_RANGE}
                [/effect]
            [/modify_unit]
        [/then]
    [/if]
#enddef

#define AP_RESTORE_ATTACK_IF_UNLOCKED ATTACK_KEY SIDE UNIT_TYPE ATTACK_NAME ATTACK_DESCRIPTION ATTACK_TYPE ATTACK_RANGE ATTACK_DAMAGE ATTACK_NUMBER ATTACK_ICON
    {AP_HAS_UNLOCKED_ATTACK {ATTACK_KEY} ap_has_attack}
    [if]
        [variable]
            name=ap_has_attack
            equals=yes
        [/variable]
        [then]
            [modify_unit]
                [filter]
                    side={SIDE}
                    type={UNIT_TYPE}
                    [not]
                        [filter_wml]
                            [attack]
                                name={ATTACK_NAME}
                                range={ATTACK_RANGE}
                                type={ATTACK_TYPE}
                            [/attack]
                        [/filter_wml]
                    [/not]
                [/filter]
                [effect]
                    apply_to=new_attack
                    name={ATTACK_NAME}
                    description={ATTACK_DESCRIPTION}
                    type={ATTACK_TYPE}
                    range={ATTACK_RANGE}
                    damage={ATTACK_DAMAGE}
                    number={ATTACK_NUMBER}
                    icon={ATTACK_ICON}
                [/effect]
            [/modify_unit]
        [/then]
    [/if]
#enddef

#define AP_REMOVE_ATTACK_UNLESS_ITEM ITEM_NAME SIDE UNIT_TYPE ATTACK_NAME
    {AP_HAS_ITEM {ITEM_NAME} ap_has_item}
    [if]
        [variable]
            name=ap_has_item
            not_equals=yes
        [/variable]
        [then]
            [modify_unit]
                [filter]
                    side={SIDE}
                    type={UNIT_TYPE}
                [/filter]
                [effect]
                    apply_to=remove_attacks
                    name={ATTACK_NAME}
                [/effect]
            [/modify_unit]
        [/then]
    [/if]
#enddef

#define AP_PLACE_CHEST_CHECK LOCATION_NAME X Y STATE_VARIABLE
    {PLACE_IMAGE items/chest-plain-closed.png {X} {Y}}
    {VARIABLE {STATE_VARIABLE} no}
#enddef

#define AP_CHEST_CHECK_EVENT LOCATION_NAME X Y STATE_VARIABLE
    [event]
        name=moveto
        first_time_only=yes
        [filter]
            side=1
            x={X}
            y={Y}
        [/filter]
        [remove_item]
            x={X}
            y={Y}
            image=items/chest-plain-closed.png
        [/remove_item]
        {PLACE_IMAGE items/chest-plain-open.png {X} {Y}}
        {VARIABLE {STATE_VARIABLE} yes}
        {AP_MARK_LOCATION {LOCATION_NAME}}
    [/event]
#enddef

#define AP_PLACE_DYNAMIC_CHESTS SCENARIO_ID
    [lua]
        code = <<
            local bridge = wesnoth.dofile("~add-ons/Battle_for_Wesnoth_AP/lua/ap_bridge.lua")
            local args = ...
            bridge.place_chests(args.scenario_id)
        >>
        [args]
            scenario_id={SCENARIO_ID}
        [/args]
    [/lua]
#enddef

#define AP_DYNAMIC_CHEST_EVENT SCENARIO_ID
    [event]
        name=moveto
        first_time_only=no
        [filter]
            side=1
        [/filter]
        [lua]
            code = <<
                local bridge = wesnoth.dofile("~add-ons/Battle_for_Wesnoth_AP/lua/ap_bridge.lua")
                local args = ...
                local checked, reward = bridge.check_chest_at(args.scenario_id, args.x, args.y)
                if checked then
                    wesnoth.set_variable("ap_last_chest_location", checked)
                    if reward then
                        wesnoth.set_variable("ap_last_chest_reward", reward)
                    else
                        wesnoth.set_variable("ap_last_chest_reward")
                    end
                else
                    wesnoth.set_variable("ap_last_chest_location")
                    wesnoth.set_variable("ap_last_chest_reward")
                end
            >>
            [args]
                scenario_id={SCENARIO_ID}
                x=$x1
                y=$y1
            [/args]
        [/lua]
        [if]
            [variable]
                name=ap_last_chest_location
                not_equals=""
            [/variable]
            [then]
                [if]
                    [variable]
                        name=ap_last_chest_reward
                        not_equals=""
                    [/variable]
                    [then]
                        [message]
                            speaker=narrator
                            message= _ "Archipelago check recorded: found $ap_last_chest_reward|."
                        [/message]
                    [/then]
                    [else]
                        [message]
                            speaker=narrator
                            message= _ "Archipelago check recorded."
                        [/message]
                    [/else]
                [/if]
            [/then]
        [/if]
    [/event]
#enddef

#define AP_COMPLETE_GOAL
    {AP_LOAD_BRIDGE}
    {VARIABLE ap_goal_complete yes}
    {AP_SAVE_BRIDGE}
#enddef
